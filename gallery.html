<!-- For Logout Button Autohide on Scroll -->
  <script>
let lastScrollY = window.scrollY;
const logoutBtn = document.getElementById("logoutBtn");

window.addEventListener("scroll", () => {
  const currentScrollY = window.scrollY;

  if (currentScrollY > lastScrollY && currentScrollY > 80) {
    // scrolling DOWN → hide
    logoutBtn.style.transform = "translateY(-100px)";
    logoutBtn.style.opacity = "0";
  } else {
    // scrolling UP → show
    logoutBtn.style.transform = "translateY(0)";
    logoutBtn.style.opacity = "1";
  }

  lastScrollY = currentScrollY;
});
</script>


<!-- For Light/Dark Mode Footer -->
<script>
const footer = document.getElementById("siteFooter");
const footerToggleBtn = document.getElementById("footerToggle");

// Load saved mode
if (localStorage.getItem("footerMode") === "light") {
  footer.classList.add("light");
  footerToggleBtn.textContent = "🌞 Light";
}

function toggleFooterMode() {
  footer.classList.toggle("light");

  if (footer.classList.contains("light")) {
    localStorage.setItem("footerMode", "light");
    toggleBtn.textContent = "🌞 Light";
  } else {
    localStorage.setItem("footerMode", "dark");
    toggleBtn.textContent = "🌙 Dark";
  }
}
</script>  


<!-- Full Page Dark Mode -->

  <script>
const themeToggleBtn = document.getElementById("themeToggle");

// Load saved theme
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  themeToggleBtn.textContent = "☀️";
}

function toggleTheme() {
  document.body.classList.toggle("dark");

  if (document.body.classList.contains("dark")) {
    localStorage.setItem("theme", "dark");
    toggleBtn.textContent = "☀️";
  } else {
    localStorage.setItem("theme", "light");
    toggleBtn.textContent = "🌙";
  }
}
  </script>
