<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --border: #1f2933;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 10% 10%, #1e293b, transparent),
                  radial-gradient(800px 500px at 90% 90%, #020617, transparent),
                  var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #0b1220, var(--card));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      font-weight: 600;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: .95rem;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      font-size: .85rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      outline: none;
      transition: border .2s, box-shadow .2s;
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,.15);
    }

    button {
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg, var(--accent), var(--accent-hover));
      color: #020617;
      font-weight: 600;
      font-size: .95rem;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(56,189,248,.35);
    }

    button:active {
      transform: translateY(0);
    }

    #msg {
      margin-top: 14px;
      font-size: .9rem;
      min-height: 1.2em;
    }

    #msg.error {
      color: var(--error);
    }

    #msg.success {
      color: var(--success);
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: .85rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Create account</h1>
    <p class="subtitle">Join us and get started in seconds</p>

    <form id="signupForm">
      <div>
        <label>Username</label>
        <input name="username" required placeholder="yourname">
      </div>

      <div>
        <label>Email</label>
        <input name="email" type="email" required placeholder="you@email.com">
      </div>

      <div>
        <label>Password</label>
        <input name="password" type="password" required placeholder="••••••••">
      </div>

      <button type="submit">Create Account</button>
    </form>

    <p id="msg"></p>

    <div class="footer">
      Already have an account?
      <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="js/account-auth.js"></script>
</body>
</html>
