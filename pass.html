<!DOCTYPE html>

<title>Protected Gallery</title>


</head>

<body>


<!--

  <div class="box">
  <h2>Enter Password</h2>

  <!-- FORM ADDED -->
<form onsubmit="check(); return false;">
  <div class="pass-box">
    <input
      type="password"
      id="pwd"
      placeholder="Password"
      autocomplete="current-password"
      required
    >
    <span id="eye" onclick="toggle()">👁️</span>
  </div>

  <br>
  <button type="submit">Unlock</button>
</form>
</div>
